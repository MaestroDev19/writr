<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Writr</title>
  <desc id="desc">Writing companion for authors: upload notes, rewrite drafts, and review scenes with cloud auth and hosted models.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F4EF"/>
      <stop offset="100%" stop-color="#EFEAE2"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#paper)"/>
  <rect x="0" y="0" width="8" height="360" fill="url(#violet)"/>
  <line x1="48" y1="36" x2="48" y2="200" stroke="#D6D0C6" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1A1523">
    <text x="64" y="52" font-size="18" font-weight="600" letter-spacing="2" fill="#6D28D9">WRITING COMPANION</text>
    <text x="64" y="112" font-size="64" font-weight="700">Writr</text>
    <text x="64" y="158" font-size="24" fill="#4A4458">Upload notes. Rewrite drafts. Get focused review feedback.</text>
    <text x="64" y="198" font-size="18" fill="#6B6575" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cloud  |  Supabase auth  |  hosted models</text>
  </g>

  <!-- full-width flow strip -->
  <g transform="translate(48 230)">
    <rect width="1104" height="96" rx="16" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/>

    <!-- Notes -->
    <g transform="translate(28 18)">
      <rect width="300" height="60" rx="12" fill="#F3EDFF" stroke="#C4B5FD" stroke-width="1.5"/>
      <rect x="20" y="18" width="56" height="8" rx="2" fill="#8B5CF6"/>
      <rect x="20" y="34" width="40" height="6" rx="2" fill="#A78BFA" opacity="0.6"/>
      <text x="96" y="38" font-size="22" font-weight="700" fill="#5B21B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1  Notes</text>
    </g>

    <path d="M342 48 L372 48" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
    <path d="M362 40 L376 48 L362 56" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Write -->
    <g transform="translate(392 18)">
      <rect width="300" height="60" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="20" y="18" width="56" height="8" rx="2" fill="#6D28D9"/>
      <rect x="20" y="34" width="44" height="6" rx="2" fill="#C4B5FD"/>
      <text x="96" y="38" font-size="22" font-weight="700" fill="#5B21B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">2  Write</text>
    </g>

    <path d="M706 48 L736 48" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
    <path d="M726 40 L740 48 L726 56" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Review -->
    <g transform="translate(756 18)">
      <rect width="320" height="60" rx="12" fill="#F8F5F0" stroke="#D6D0C6" stroke-width="1.5"/>
      <circle cx="36" cy="30" r="12" fill="#8B5CF6"/>
      <path d="M30 30 L34 34 L44 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="38" font-size="22" font-weight="700" fill="#5B21B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">3  Review</text>
    </g>
  </g>
</svg>
